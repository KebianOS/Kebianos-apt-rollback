# kebianos-apt-rollback
# yes = si apt deja paquetes rotos, restaurar el snapshot automaticamente
# no  = solo avisar (el snapshot queda disponible)
AUTO_ROLLBACK=yes

# Cuantos snapshots pre-update-* conservar
KEEP=5

# Cuantos subvolumenes @failed-* (sistemas fallidos) conservar
KEEP_FAILED=2

# Subvolumen (en el top-level de Btrfs) donde se guardan los snapshots
SNAPDIR=@snapshots
